<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 2018" width="1500" height="2018" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#E6EBF0" stroke-width="1"/>
  </pattern>
  <pattern id="grid5" width="100" height="100" patternUnits="userSpaceOnUse">
    <rect width="100" height="100" fill="url(#grid)"/>
    <path d="M100 0H0V100" fill="none" stroke="#D6DEE7" stroke-width="1"/>
  </pattern>
  <marker id="tri-hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M0 0 L12 6 L0 12 Z" fill="#FFFFFF" stroke="#1F3B57" stroke-width="1.4"/>
  </marker>
  <marker id="diamond-navy" viewBox="0 0 14 10" refX="0.5" refY="5" markerWidth="15" markerHeight="11" orient="auto-start-reverse">
    <path d="M0 5 L7 0 L14 5 L7 10 Z" fill="#1F3B57"/>
  </marker>
  <marker id="tri-gray" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
    <path d="M0 0 L12 6 L0 12 Z" fill="#FFFFFF" stroke="#8FA0B3" stroke-width="1.4"/>
  </marker>
</defs>
<rect width="1500" height="2018" fill="#FBFAF8"/>
<rect width="1500" height="2018" fill="url(#grid5)"/>

<text x="60" y="56" font-size="14" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="2.5">LUNEX — SUB-MODEL 2</text>
<text x="60" y="86" font-size="26" font-weight="600" fill="#16202B" text-anchor="start">Asset Hierarchy / Namespace</text>
<text x="60" y="110" font-size="13" font-weight="400" fill="#5A6B7B" text-anchor="start">A composed, addressable containment chain, mapped onto Purdue levels 0–4</text>
<rect x="140" y="150" width="480" height="108" rx="12" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="164" y="184" font-size="19" font-weight="700" fill="#1F3B57" text-anchor="start">Realm</text>
<text x="164" y="208" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">root namespace — the whole organization</text>
<rect x="650" y="188.0" width="64" height="32" rx="16" fill="#1F3B57" stroke="none" stroke-width="2" fill-opacity="1.0"/>
<text x="682.0" y="209.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">L4</text>
<rect x="140" y="312" width="480" height="108" rx="12" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2" stroke-dasharray="6,4"/>
<text x="164" y="346" font-size="19" font-weight="700" fill="#1F3B57" text-anchor="start">Domain</text>
<text x="164" y="370" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">business unit / sub-namespace</text>
<text x="164" y="394" font-size="11.5" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">optional — skip when trivial</text>
<rect x="650" y="350.0" width="64" height="32" rx="16" fill="#1F3B57" stroke="none" stroke-width="2" fill-opacity="1.0"/>
<text x="682.0" y="371.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">L4</text>
<rect x="140" y="474" width="480" height="108" rx="12" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="164" y="508" font-size="19" font-weight="700" fill="#1F3B57" text-anchor="start">Location</text>
<text x="164" y="532" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">physical location — plant, building, vessel, remote site</text>
<rect x="650" y="512.0" width="64" height="32" rx="16" fill="#1F3B57" stroke="none" stroke-width="2" fill-opacity="1.0"/>
<text x="682.0" y="533.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">L4</text>
<rect x="140" y="636" width="480" height="108" rx="12" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="164" y="670" font-size="19" font-weight="700" fill="#1F3B57" text-anchor="start">Area</text>
<text x="164" y="694" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">process area within a Location</text>
<rect x="650" y="674.0" width="64" height="32" rx="16" fill="#1F3B57" stroke="none" stroke-width="2" fill-opacity="0.8"/>
<text x="682.0" y="695.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">L3</text>
<rect x="140" y="798" width="480" height="108" rx="12" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="164" y="832" font-size="19" font-weight="700" fill="#1F3B57" text-anchor="start">Cell</text>
<text x="164" y="856" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">process cell within an Area</text>
<rect x="650" y="836.0" width="64" height="32" rx="16" fill="#1F3B57" stroke="none" stroke-width="2" fill-opacity="0.65"/>
<text x="682.0" y="857.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">L2/L3</text>
<rect x="140" y="960" width="480" height="108" rx="12" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="164" y="994" font-size="19" font-weight="700" fill="#1F3B57" text-anchor="start">System</text>
<text x="164" y="1018" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">functional unit within a Cell — equivalent to ISA-88's Unit</text>
<rect x="650" y="998.0" width="64" height="32" rx="16" fill="#1F3B57" stroke="none" stroke-width="2" fill-opacity="0.55"/>
<text x="682.0" y="1019.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">L2</text>
<rect x="140" y="1122" width="480" height="108" rx="12" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="164" y="1156" font-size="19" font-weight="700" fill="#1F3B57" text-anchor="start">Assembly</text>
<text x="164" y="1180" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">functional device group → see Sub-model 3 (topology patterns)</text>
<rect x="650" y="1160.0" width="64" height="32" rx="16" fill="#1F3B57" stroke="none" stroke-width="2" fill-opacity="0.42"/>
<text x="682.0" y="1181.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">L1/L2</text>
<rect x="140" y="1284" width="480" height="108" rx="12" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="164" y="1318" font-size="19" font-weight="700" fill="#1F3B57" text-anchor="start">Device</text>
<text x="164" y="1342" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">Sensor / Transducer / Control Unit / Signal Converter / Actuator → see Sub-model 1</text>
<rect x="650" y="1322.0" width="64" height="32" rx="16" fill="#1F3B57" stroke="none" stroke-width="2" fill-opacity="0.32"/>
<text x="682.0" y="1343.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">L1</text>
<rect x="140" y="1446" width="480" height="108" rx="12" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="164" y="1480" font-size="19" font-weight="700" fill="#1F3B57" text-anchor="start">Component</text>
<text x="164" y="1504" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">not independently addressable → see Sub-model 1</text>
<rect x="650" y="1484.0" width="64" height="32" rx="16" fill="#1F3B57" stroke="none" stroke-width="2" fill-opacity="0.22"/>
<text x="682.0" y="1505.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">L0/L1</text>
<line x1="210" y1="258" x2="210" y2="312" stroke="#1F3B57" stroke-width="2" marker-end="url(#tri-hollow)" marker-start="url(#diamond-navy)"/>
<text x="224" y="289.0" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">0..*</text>
<line x1="210" y1="420" x2="210" y2="474" stroke="#1F3B57" stroke-width="2" marker-end="url(#tri-hollow)" marker-start="url(#diamond-navy)"/>
<text x="224" y="451.0" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">0..*</text>
<line x1="210" y1="582" x2="210" y2="636" stroke="#1F3B57" stroke-width="2" marker-end="url(#tri-hollow)" marker-start="url(#diamond-navy)"/>
<text x="224" y="613.0" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">0..*</text>
<line x1="210" y1="744" x2="210" y2="798" stroke="#1F3B57" stroke-width="2" marker-end="url(#tri-hollow)" marker-start="url(#diamond-navy)"/>
<text x="224" y="775.0" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">0..*</text>
<line x1="210" y1="906" x2="210" y2="960" stroke="#1F3B57" stroke-width="2" marker-end="url(#tri-hollow)" marker-start="url(#diamond-navy)"/>
<text x="224" y="937.0" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">0..*</text>
<line x1="210" y1="1068" x2="210" y2="1122" stroke="#1F3B57" stroke-width="2" marker-end="url(#tri-hollow)" marker-start="url(#diamond-navy)"/>
<text x="224" y="1099.0" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">0..*</text>
<line x1="210" y1="1230" x2="210" y2="1284" stroke="#1F3B57" stroke-width="2" marker-end="url(#tri-hollow)" marker-start="url(#diamond-navy)"/>
<text x="224" y="1261.0" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">0..*</text>
<line x1="210" y1="1392" x2="210" y2="1446" stroke="#1F3B57" stroke-width="2" marker-end="url(#tri-hollow)" marker-start="url(#diamond-navy)"/>
<text x="224" y="1423.0" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">0..*</text>
<path d="M 140 240 C 85 240, 85 492, 140 492" fill="none" stroke="#8FA0B3" stroke-width="2" marker-end="url(#tri-gray)" stroke-dasharray="5,4"/>
<text x="69" y="366.0" font-size="11.5" fill="#5A6B7B" font-style="italic" text-anchor="middle" transform="rotate(-90 69 366.0)">skip when trivial</text>
<rect x="60" y="1624" width="1380" height="190" rx="12" fill="#FFFFFF" stroke="#5A6B7B" stroke-width="1.5"/>
<text x="84" y="1654" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="1.5">ADDRESSABLE PATH — EXAMPLE</text>
<text x="84" y="1686" font-size="14.5" font-weight="600" fill="#16202B" text-anchor="start" font-family="Consolas, Menlo, monospace">lunex://AcmeCorp/Benelux/RotterdamPlant/Utilities/Boilerhouse/BoilerUnit-1/PressureLoop-3/PT-101</text>
<text x="84" y="1719" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="0.5">Realm</text>
<text x="84" y="1737" font-size="11" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">AcmeCorp</text>
<text x="250.5" y="1719" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="0.5">Domain</text>
<text x="250.5" y="1737" font-size="11" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">Benelux</text>
<text x="417.0" y="1719" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="0.5">Location</text>
<text x="417.0" y="1737" font-size="11" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">RotterdamPlant</text>
<text x="583.5" y="1719" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="0.5">Area</text>
<text x="583.5" y="1737" font-size="11" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">Utilities</text>
<text x="750.0" y="1719" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="0.5">Cell</text>
<text x="750.0" y="1737" font-size="11" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">Boilerhouse</text>
<text x="916.5" y="1719" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="0.5">System</text>
<text x="916.5" y="1737" font-size="11" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">BoilerUnit-1</text>
<text x="1083.0" y="1719" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="0.5">Assembly</text>
<text x="1083.0" y="1737" font-size="11" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">PressureLoop-3</text>
<text x="1249.5" y="1719" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="0.5">Device</text>
<text x="1249.5" y="1737" font-size="11" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">PT-101</text>
<text x="84" y="1774" font-size="12.5" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">every LunexObject.id (Sub-model 1) is derivable from its position in this chain —</text>
<text x="84" y="1792" font-size="12.5" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">Component only appears in the path when addressing an internal signal, e.g. ...PT-101/AI-input</text>
<line x1="60" y1="1859" x2="1440" y2="1859" stroke="#D6DEE7" stroke-width="1"/>
<text x="60" y="1882" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="1.6">LEGEND</text>
<line x1="60" y1="1914" x2="110" y2="1914" stroke="#1F3B57" stroke-width="2" marker-end="url(#tri-hollow)" marker-start="url(#diamond-navy)"/>
<text x="122" y="1919" font-size="13" font-weight="400" fill="#16202B" text-anchor="start">composition (has 0..*)</text>
<rect x="380" y="1898" width="64" height="32" rx="16" fill="#1F3B57" stroke="none" stroke-width="2" fill-opacity="1.0"/>
<text x="412" y="1919" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">L4</text>
<text x="460" y="1919" font-size="13" font-weight="400" fill="#16202B" text-anchor="start">Purdue level (darker = closer to Enterprise)</text>
<rect x="60" y="1944" width="44" height="26" rx="13" fill="#FFFFFF" stroke="#1F3B57" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="82" y="1963" font-size="13" font-weight="400" fill="#16202B" text-anchor="middle"></text>
<text x="115" y="1963" font-size="13" font-weight="400" fill="#16202B" text-anchor="start">dashed border = optional level</text>
<path d="M 500 1958 L 550 1958" fill="none" stroke="#8FA0B3" stroke-width="2" marker-end="url(#tri-gray)" stroke-dasharray="5,4"/>
<text x="562" y="1963" font-size="13" font-weight="400" fill="#16202B" text-anchor="start">illustrates skipping a level when trivial</text>
</svg>