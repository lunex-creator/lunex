<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1520" width="1600" height="1520" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#E6EBF0" stroke-width="1"/>
  </pattern>
  <pattern id="grid5" width="100" height="100" patternUnits="userSpaceOnUse">
    <rect width="100" height="100" fill="url(#grid)"/>
    <path d="M100 0H0V100" fill="none" stroke="#D6DEE7" stroke-width="1"/>
  </pattern>
  <marker id="tri-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#1F3B57"/>
  </marker>
  <marker id="tri-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#2F6F9E"/>
  </marker>
  <marker id="tri-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#8FA0B3"/>
  </marker>
  <marker id="diamond-navy" viewBox="0 0 14 10" refX="0.5" refY="5" markerWidth="15" markerHeight="11" orient="auto-start-reverse">
    <path d="M0 5 L7 0 L14 5 L7 10 Z" fill="#1F3B57"/>
  </marker>
</defs>

<rect width="1600" height="1520" fill="#FBFAF8"/>
<rect width="1600" height="1520" fill="url(#grid5)"/>

<text x="60" y="56" font-size="14" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="2.5">LUNEX — SUB-MODEL 11</text>
<text x="60" y="86" font-size="26" font-weight="600" fill="#16202B" text-anchor="start">Alarm Response Guidance</text>
<text x="60" y="110" font-size="13" font-weight="400" fill="#5A6B7B" text-anchor="start">ISA-18.2 response procedures — actionable (Sub-model 10) says the operator CAN act; this says HOW</text>
<rect x="30" y="145" width="1540" height="400" rx="10" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.2"/>
<text x="58" y="183" font-size="20" font-weight="700" fill="#2F6F9E" text-anchor="start">Alarm Response Procedure (ARP) — a Reusable Template</text>
<text x="58" y="205" font-size="12.5" font-weight="400" fill="#5A6B7B" text-anchor="start">tied to the alarm TYPE, not to each Alarm instance — same template pattern as the Inventory (Sub-model 1)</text>
<rect x="60" y="245" width="620" height="220" rx="8" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="78" y="273" font-size="13.5" font-weight="700" fill="#2F6F9E" text-anchor="start">AlarmResponseProcedure</text>
<text x="78" y="301" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ id : string</text>
<text x="78" y="325" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ appliesTo : AlarmType (condition key)</text>
<text x="78" y="349" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ probableCause : string</text>
<text x="78" y="373" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ consequenceIfIgnored : string</text>
<text x="78" y="397" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ correctiveAction : string</text>
<text x="78" y="421" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ escalation : string</text>
<text x="78" y="445" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ reference : string  (SOP / document link)</text>
<rect x="735.0" y="266.0" width="90" height="38" rx="6" fill="#FFFFFF" stroke="#B3402F" stroke-width="2"/>
<text x="780" y="290" font-size="12" font-weight="700" fill="#B3402F" text-anchor="middle" font-family="Consolas, Menlo, monospace">A</text>
<rect x="735.0" y="326.0" width="90" height="38" rx="6" fill="#FFFFFF" stroke="#B3402F" stroke-width="2"/>
<text x="780" y="350" font-size="12" font-weight="700" fill="#B3402F" text-anchor="middle" font-family="Consolas, Menlo, monospace">A</text>
<rect x="735.0" y="386.0" width="90" height="38" rx="6" fill="#FFFFFF" stroke="#B3402F" stroke-width="2"/>
<text x="780" y="410" font-size="12" font-weight="700" fill="#B3402F" text-anchor="middle" font-family="Consolas, Menlo, monospace">A</text>
<rect x="1010" y="315" width="240" height="60" rx="10" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.4"/>
<text x="1130" y="339" font-size="13" font-weight="700" fill="#2F6F9E" text-anchor="middle">ARP: “High Vessel</text>
<text x="1130" y="359" font-size="13" font-weight="700" fill="#2F6F9E" text-anchor="middle">Pressure”</text>
<line x1="825" y1="285" x2="1010" y2="345" stroke="#1F3B57" stroke-width="1.6"/>
<line x1="825" y1="345" x2="1010" y2="345" stroke="#1F3B57" stroke-width="1.6"/>
<line x1="825" y1="405" x2="1010" y2="345" stroke="#1F3B57" stroke-width="1.6"/>
<polygon points="1002.5,345 1010,339.5 1017.5,345 1010,350.5" fill="#1F3B57"/>
<text x="780" y="240" font-size="12" font-weight="700" fill="#5A6B7B" text-anchor="middle">3 alarms of the same type</text>
<text x="58" y="515" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">one ARP serves every alarm of that type — not duplicated per instance, and updated in exactly one place</text>
<rect x="30" y="595" width="1540" height="340" rx="10" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.2"/>
<text x="58" y="633" font-size="20" font-weight="700" fill="#2F6F9E" text-anchor="start">Mandatory Where It Matters</text>
<text x="58" y="655" font-size="12.5" font-weight="400" fill="#5A6B7B" text-anchor="start">reuses the Priority Matrix from Sub-model 10 — no new severity scale invented</text>
<rect x="340" y="705" width="420" height="90" rx="10" fill="#FFFFFF" stroke="#B3402F" stroke-width="2.4"/>
<text x="360" y="737" font-size="14" font-weight="700" fill="#B3402F" text-anchor="start">Priority 1 — Critical</text>
<rect x="620" y="723" width="120" height="26" rx="13" fill="#FFFFFF" stroke="#B3402F" stroke-width="1.6"/>
<text x="680" y="740" font-size="10.5" font-weight="700" fill="#B3402F" text-anchor="middle">ARP required</text>
<rect x="760" y="705" width="420" height="90" rx="10" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.4"/>
<text x="780" y="737" font-size="14" font-weight="700" fill="#2F6F9E" text-anchor="start">Priority 2 — High</text>
<rect x="1040" y="723" width="120" height="26" rx="13" fill="#FFFFFF" stroke="#B3402F" stroke-width="1.6"/>
<text x="1100" y="740" font-size="10.5" font-weight="700" fill="#B3402F" text-anchor="middle">ARP required</text>
<rect x="340" y="795" width="420" height="90" rx="10" fill="#FFFFFF" stroke="#5A6B7B" stroke-width="2.4"/>
<text x="360" y="827" font-size="14" font-weight="700" fill="#5A6B7B" text-anchor="start">Priority 3 — Informational</text>
<rect x="620" y="813" width="120" height="26" rx="13" fill="#FFFFFF" stroke="#5A6B7B" stroke-width="1.6"/>
<text x="680" y="830" font-size="10.5" font-weight="700" fill="#5A6B7B" text-anchor="middle">ARP optional</text>
<rect x="760" y="795" width="420" height="90" rx="10" fill="#FFFFFF" stroke="#8FA0B3" stroke-width="2.4"/>
<text x="780" y="827" font-size="14" font-weight="700" fill="#8FA0B3" text-anchor="start">Priority 4 — Log Only</text>
<rect x="1040" y="813" width="120" height="26" rx="13" fill="#FFFFFF" stroke="#5A6B7B" stroke-width="1.6"/>
<text x="1100" y="830" font-size="10.5" font-weight="700" fill="#5A6B7B" text-anchor="middle">ARP optional</text>
<text x="58" y="903" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">an actionable, high-severity alarm with no corrective action text is exactly the gap ISA-18.2 exists to close</text>
<rect x="30" y="985" width="1540" height="380" rx="10" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.2"/>
<text x="58" y="1023" font-size="20" font-weight="700" fill="#2F6F9E" text-anchor="start">Context at the Moment It Matters</text>
<text x="58" y="1045" font-size="12.5" font-weight="400" fill="#5A6B7B" text-anchor="start">no new data source — the alarm screen surfaces relationships the Context Layer (Sub-model 7) already has</text>
<rect x="150" y="1145" width="220" height="80" rx="10" fill="#FFFFFF" stroke="#B3402F" stroke-width="2.4"/>
<text x="260" y="1173" font-size="14.5" font-weight="700" fill="#B3402F" text-anchor="middle">Alarm</text>
<text x="260" y="1197" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="middle">High Vessel Pressure</text>
<rect x="780" y="1062" width="320" height="56" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<text x="800" y="1096" font-size="13" font-weight="700" fill="#2E7D4F" text-anchor="start">PT-101 trend</text>
<line x1="370" y1="1185" x2="776" y2="1090" stroke="#2E7D4F" stroke-width="1.8" marker-end="url(#tri-navy)"/>
<rect x="547.2" y="1115.15" width="51.599999999999994" height="18.65" rx="3" fill="#FBFAF8" stroke="none" stroke-width="2"/>
<text x="573.0" y="1127.5" font-size="11" font-weight="400" fill="#2E7D4F" text-anchor="middle" font-style="italic">source</text>
<rect x="780" y="1157" width="320" height="56" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<text x="800" y="1191" font-size="13" font-weight="700" fill="#2E7D4F" text-anchor="start">Vessel-01</text>
<line x1="370" y1="1185" x2="776" y2="1185" stroke="#2E7D4F" stroke-width="1.8" marker-end="url(#tri-navy)"/>
<rect x="540.6" y="1162.65" width="64.8" height="18.65" rx="3" fill="#FBFAF8" stroke="none" stroke-width="2"/>
<text x="573.0" y="1175.0" font-size="11" font-weight="400" fill="#2E7D4F" text-anchor="middle" font-style="italic">measures</text>
<rect x="780" y="1252" width="320" height="56" rx="10" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2"/>
<text x="800" y="1286" font-size="13" font-weight="700" fill="#2F6F9E" text-anchor="start">ARP: corrective action</text>
<line x1="370" y1="1185" x2="776" y2="1280" stroke="#2F6F9E" stroke-width="1.8" marker-end="url(#tri-blue)"/>
<rect x="537.3" y="1210.15" width="71.4" height="18.65" rx="3" fill="#FBFAF8" stroke="none" stroke-width="2"/>
<text x="573.0" y="1222.5" font-size="11" font-weight="400" fill="#2F6F9E" text-anchor="middle" font-style="italic">procedure</text>
<text x="58" y="1335" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">same operator screen, zero extra configuration — the relationships already existed, this just surfaces them on alarm</text>
<line x1="60" y1="1405" x2="1540" y2="1405" stroke="#D6DEE7" stroke-width="1"/>
<text x="60" y="1428" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="1.6">LEGEND</text>
<line x1="60" y1="1460" x2="100" y2="1460" stroke="#1F3B57" stroke-width="2" marker-end="url(#diamond-navy)"/>
<text x="150" y="1465" font-size="13" font-weight="400" fill="#16202B" text-anchor="start">shares / uses (template reuse)</text>
<rect x="400" y="1447" width="100" height="26" rx="13" fill="#FFFFFF" stroke="#B3402F" stroke-width="1.6"/>
<text x="450" y="1465" font-size="10.5" font-weight="700" fill="#B3402F" text-anchor="middle">ARP required</text>
<text x="510" y="1465" font-size="13" font-weight="400" fill="#16202B" text-anchor="start">for Priority 1/2 alarms</text>
</svg>