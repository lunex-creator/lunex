<text x="640" y="234" font-size="10.5" font-weight="700" fill="#5A6B7B" text-anchor="start" letter-spacing="1">ROLLUP</text>
<text x="900" y="234" font-size="10.5" font-weight="700" fill="#5A6B7B" text-anchor="start" letter-spacing="1">TOP ALARM</text>
