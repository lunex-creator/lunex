<text x="900" y="514" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">High Vibration (Priority 1)</text>
<text x="58" y="550" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">same worst-case Pump-07 alarm is visible from the top of the hierarchy — the operator never wonders “is anything wrong?”</text>
<rect x="30" y="635" width="1540" height="380" rx="10" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.2"/>
<text x="58" y="673" font-size="20" font-weight="700" fill="#2F6F9E" text-anchor="start">Jump to Worst — No Manual Digging Through Layers</text>
