<text x="60" y="56" font-size="14" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="2.5">LUNEX — SUB-MODEL 13</text>
<text x="60" y="86" font-size="26" font-weight="600" fill="#16202B" text-anchor="start">Situational Awareness</text>
<text x="60" y="110" font-size="13" font-weight="400" fill="#5A6B7B" text-anchor="start">no new data — a navigation contract over Sub-models 7, 9 and 10, so the operator is never lost or digging</text>
