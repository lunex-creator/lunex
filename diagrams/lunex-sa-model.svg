<rect x="760" y="1161" width="340" height="48" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<text x="780" y="1191" font-size="13" font-weight="700" fill="#2E7D4F" text-anchor="start">trend, last 4h</text>
<line x1="380" y1="1255" x2="756" y2="1185" stroke="#2E7D4F" stroke-width="1.8" marker-end="url(#tri-navy)"/>
