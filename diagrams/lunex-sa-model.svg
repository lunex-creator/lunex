<text x="58" y="183" font-size="20" font-weight="700" fill="#2F6F9E" text-anchor="start">The Same Three Signals, at Every Level</text>
<text x="58" y="205" font-size="12.5" font-weight="400" fill="#5A6B7B" text-anchor="start">own state · rollup badge · top alarm — identical shape from Realm down to Device (Sub-model 2)</text>
