<text x="654" y="433.85" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">0</text>
<text x="678" y="436" font-size="11.5" font-weight="700" fill="#B3402F" text-anchor="start">Critical</text>
<text x="900" y="436" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">Pump-07: High Vibration</text>
