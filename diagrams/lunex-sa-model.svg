<text x="488" y="1465" font-size="13" font-weight="400" fill="#16202B" text-anchor="start">jumpToWorst() shortcut</text>
<line x1="750" y1="1460" x2="796" y2="1460" stroke="#1F3B57" stroke-width="1.8" marker-end="url(#tri-navy)"/>
<text x="808" y="1465" font-size="13" font-weight="400" fill="#16202B" text-anchor="start">context surfaced automatically</text>
