<line x1="380" y1="1255" x2="756" y2="1255" stroke="#2F6F9E" stroke-width="1.8" marker-end="url(#tri-navy)"/>
<rect x="760" y="1301" width="340" height="48" rx="10" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="780" y="1331" font-size="13" font-weight="700" fill="#1F3B57" text-anchor="start">nearest Interlock: IL-014</text>
<line x1="380" y1="1255" x2="756" y2="1325" stroke="#1F3B57" stroke-width="1.8" marker-end="url(#tri-navy)"/>
<text x="58" y="1335" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">one screen: alarm, trend, procedure and nearest safeguard together — nothing else to click through</text>
<line x1="60" y1="1405" x2="1540" y2="1405" stroke="#D6DEE7" stroke-width="1"/>
<text x="60" y="1428" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="1.6">LEGEND</text>
