<text x="1095.0" y="800" font-size="13" font-weight="700" fill="#1F3B57" text-anchor="middle">Device</text>
<line x1="1160.0" y1="795" x2="1355.0" y2="795" stroke="#8FA0B3" stroke-width="1.6" stroke-dasharray="3,3"/>
<rect x="1215.5" y="751.5" width="84.0" height="17.5" rx="3" fill="#FBFAF8" stroke="none" stroke-width="2"/>
<text x="1257.5" y="763" font-size="10" font-weight="400" fill="#5A6B7B" text-anchor="middle" font-style="italic">manual click</text>
<rect x="1355.0" y="771" width="130" height="48" rx="10" fill="#FFFFFF" stroke="#B3402F" stroke-width="2.2"/>
<text x="1420.0" y="800" font-size="13" font-weight="700" fill="#B3402F" text-anchor="middle">Alarm</text>
<path d="M 120 819 C 120 885, 1420.0 885, 1420.0 819" fill="none" stroke="#B3402F" stroke-width="2.4" marker-end="url(#tri-red)"/>
<rect x="588.5" y="898.95" width="363.0" height="20.95" rx="3" fill="#FBFAF8" stroke="none" stroke-width="2"/>
<text x="770.0" y="913" font-size="13" font-weight="700" fill="#B3402F" text-anchor="middle">jumpToWorst(node)  —  one action, same result</text>
<text x="58" y="980" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">the shortcut and the manual path always land on the same Device/Alarm — it's a shortcut, not a different answer</text>
<rect x="30" y="1065" width="1540" height="300" rx="10" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.2"/>
