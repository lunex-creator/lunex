<text x="652.0" y="757" font-size="10" font-weight="400" fill="#5A6B7B" text-anchor="middle">L3</text>
<line x1="717.0" y1="740" x2="735.0" y2="740" stroke="#8FA0B3" stroke-width="1.4"/>
<rect x="735.0" y="715" width="130" height="50" rx="8" fill="#FFFFFF" stroke="#1F3B57" stroke-width="1.8"/>
