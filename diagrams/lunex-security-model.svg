<circle cx="874.0" cy="677" r="13" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.2"/>
<text x="874.0" y="681" font-size="9.5" font-weight="700" fill="#2F6F9E" text-anchor="middle">FW</text>
<circle cx="1170.0" cy="677" r="13" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.2"/>
<text x="1170.0" y="681" font-size="9.5" font-weight="700" fill="#2F6F9E" text-anchor="middle">FW</text>
<text x="58" y="825" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">FW = Firewall / IDS Control Unit sitting on the Conduit between two Zones (Sub-model 1)</text>
<text x="58" y="845" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">zone boundaries are illustrative — real deployments vary; membership is what the Zone object defines, not position alone</text>
<rect x="30" y="915" width="1540" height="320" rx="10" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.2"/>
<text x="58" y="953" font-size="20" font-weight="700" fill="#2F6F9E" text-anchor="start">Conduit Detail — Where Firewall / IDS Lives</text>
<text x="58" y="975" font-size="12.5" font-weight="400" fill="#5A6B7B" text-anchor="start">a controlled crossing point between two Zones, not a shared Control Unit</text>
<rect x="90" y="1025" width="380" height="140" rx="10" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2" stroke-dasharray="5,4"/>
<text x="110" y="1055" font-size="14.5" font-weight="700" fill="#1F3B57" text-anchor="start">Zone: Operations</text>
<text x="110" y="1075" font-size="11.5" font-weight="400" fill="#5A6B7B" text-anchor="start">SL-T 2</text>
<rect x="382.0" y="1086.0" width="56" height="38" rx="6" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="410" y="1110" font-size="12.5" font-weight="700" fill="#1F3B57" text-anchor="middle" font-family="Consolas, Menlo, monospace">CU</text>
<text x="410" y="1143" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="middle" font-style="italic">SCADA server</text>
<rect x="1130" y="1025" width="380" height="140" rx="10" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2" stroke-dasharray="5,4"/>
<text x="1150" y="1055" font-size="14.5" font-weight="700" fill="#1F3B57" text-anchor="start">Zone: Control</text>
<text x="1150" y="1075" font-size="11.5" font-weight="400" fill="#5A6B7B" text-anchor="start">SL-T 3</text>
<rect x="1162.0" y="1086.0" width="56" height="38" rx="6" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="1190" y="1110" font-size="12.5" font-weight="700" fill="#1F3B57" text-anchor="middle" font-family="Consolas, Menlo, monospace">CU</text>
<text x="1190" y="1143" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="middle" font-style="italic">PLC</text>
<line x1="438" y1="1105" x2="740.0" y2="1105" stroke="#2F6F9E" stroke-width="2" marker-end="url(#tri-blue)"/>
<line x1="860.0" y1="1105" x2="1162" y2="1105" stroke="#2F6F9E" stroke-width="2" marker-end="url(#tri-blue)"/>
<rect x="740.0" y="1075" width="120" height="60" rx="10" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.6"/>
<text x="800.0" y="1099" font-size="12.5" font-weight="700" fill="#2F6F9E" text-anchor="middle">Firewall / IDS</text>
<text x="800.0" y="1118" font-size="11" font-weight="400" fill="#5A6B7B" text-anchor="middle">Control Unit</text>
<text x="800.0" y="1153" font-size="11.5" font-weight="700" fill="#2F6F9E" text-anchor="middle">Conduit · SL-T 2</text>
<text x="58" y="1195" font-size="12.5" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">contrast with Sub-model 5: there, a shared Control Unit between BPCS and SIF was forbidden.</text>
<text x="58" y="1213" font-size="12.5" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">here, a Control Unit governing the crossing is the entire point — different rule, different context.</text>
<line x1="60" y1="1275" x2="1540" y2="1275" stroke="#D6DEE7" stroke-width="1"/>
<text x="60" y="1298" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="1.6">LEGEND</text>
<line x1="60" y1="1330" x2="106" y2="1330" stroke="#1F3B57" stroke-width="2" marker-end="url(#tri-hollow)"/>
<text x="118" y="1335" font-size="13" font-weight="400" fill="#16202B" text-anchor="start">inheritance (extends)</text>
<line x1="320" y1="1330" x2="366" y2="1330" stroke="#2F6F9E" stroke-width="2" marker-end="url(#tri-blue)"/>
<text x="378" y="1335" font-size="13" font-weight="400" fill="#16202B" text-anchor="start">conduit traffic, via Firewall/IDS</text>
<circle cx="700" cy="1330" r="12" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2"/>
<text x="700" y="1334" font-size="9" font-weight="700" fill="#2F6F9E" text-anchor="middle">FW</text>
<text x="722" y="1335" font-size="13" font-weight="400" fill="#16202B" text-anchor="start">Firewall/IDS at a zone boundary</text>
</svg>