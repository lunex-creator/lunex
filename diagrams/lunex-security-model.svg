<text x="1392.0" y="757" font-size="10" font-weight="400" fill="#5A6B7B" text-anchor="middle">L0/L1</text>
<rect x="143.0" y="660" width="426.0" height="34" rx="8" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2.2"/>
<text x="356.0" y="676" font-size="12" font-weight="700" fill="#2E7D4F" text-anchor="middle">Enterprise / IT Zone</text>
<text x="356.0" y="690" font-size="10" font-weight="400" fill="#2E7D4F" text-anchor="middle">SL-T 1</text>
<line x1="208.0" y1="694" x2="208.0" y2="715" stroke="#2E7D4F" stroke-width="1.6" stroke-dasharray="3,3"/>
<line x1="356.0" y1="694" x2="356.0" y2="715" stroke="#2E7D4F" stroke-width="1.6" stroke-dasharray="3,3"/>
