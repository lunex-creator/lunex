<rect width="1600" height="1390" fill="#FBFAF8"/>
<rect width="1600" height="1390" fill="url(#grid5)"/>

<text x="60" y="56" font-size="14" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="2.5">LUNEX — SUB-MODEL 6</text>
<text x="60" y="86" font-size="26" font-weight="600" fill="#16202B" text-anchor="start">Security</text>
<text x="60" y="110" font-size="13" font-weight="400" fill="#5A6B7B" text-anchor="start">IEC 62443 zones and conduits, mapped onto Sub-models 1–2 — Zone is now exclusively the security term</text>
<rect x="30" y="145" width="1540" height="330" rx="10" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.2"/>
<text x="58" y="183" font-size="20" font-weight="700" fill="#2F6F9E" text-anchor="start">Zone &amp; Conduit — First-Class LunexObjects</text>
<text x="58" y="205" font-size="12.5" font-weight="400" fill="#5A6B7B" text-anchor="start">same pattern as Interlock (Sub-model 5): peers of Device and Component, not subtypes</text>
<rect x="90" y="245" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="200.0" y="267" font-size="13.5" font-weight="700" fill="#1F3B57" text-anchor="middle">LunexObject</text>
<text x="200.0" y="285" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="middle" font-style="italic">«abstract»</text>
<rect x="90" y="340" width="100" height="60" rx="8" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.4"/>
<text x="140.0" y="366" font-size="14" font-weight="700" fill="#2F6F9E" text-anchor="middle">Zone</text>
<text x="140.0" y="386" font-size="9.5" font-weight="400" fill="#5A6B7B" text-anchor="middle" font-style="italic">extends</text>
<rect x="210" y="340" width="100" height="60" rx="8" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.4"/>
<text x="260.0" y="366" font-size="13" font-weight="700" fill="#2F6F9E" text-anchor="middle">Conduit</text>
<text x="260.0" y="386" font-size="9.5" font-weight="400" fill="#5A6B7B" text-anchor="middle" font-style="italic">extends</text>
<path d="M 140.0 340 L 182.0 295" fill="none" stroke="#1F3B57" stroke-width="2" marker-end="url(#tri-hollow)"/>
<path d="M 260.0 340 L 218.0 295" fill="none" stroke="#1F3B57" stroke-width="2" marker-end="url(#tri-hollow)"/>
<text x="90" y="426" font-size="11.5" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">peer of Device, Component and</text>
<text x="90" y="444" font-size="11.5" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">Interlock (Sub-models 1, 5)</text>
<rect x="380" y="245" width="260" height="195" rx="8" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="396" y="271" font-size="14" font-weight="700" fill="#2F6F9E" text-anchor="start">Zone</text>
<text x="396" y="295" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ id : string</text>
<text x="396" y="319" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ members : LunexObjectRef[]</text>
<text x="396" y="343" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ securityLevelTarget : SL-T (0-4)</text>
<text x="396" y="367" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ securityLevelAchieved : SL-A (0-4)</text>
<text x="396" y="391" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ purdueLevel : ref (Sub-model 2)</text>
<rect x="660" y="245" width="280" height="195" rx="8" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="676" y="271" font-size="14" font-weight="700" fill="#2F6F9E" text-anchor="start">Conduit</text>
<text x="676" y="295" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ id : string</text>
<text x="676" y="319" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ zoneA : ZoneRef</text>
<text x="676" y="343" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ zoneB : ZoneRef</text>
<text x="676" y="367" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ controlUnit : DeviceRef</text>
<text x="676" y="391" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">  (Firewall / IDS, Sub-model 1)</text>
<text x="676" y="415" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ securityLevelTarget : SL-T (0-4)</text>
<text x="980" y="271" font-size="12.5" font-weight="700" fill="#16202B" text-anchor="start">why Zone was renamed away</text>
<text x="980" y="293" font-size="12.5" font-weight="700" fill="#16202B" text-anchor="start">from Sub-model 2:</text>
<text x="980" y="317" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">a physical Area and a security</text>
<text x="980" y="335" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">Zone don't always coincide —</text>
<text x="980" y="353" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">one word for both would hide</text>
<text x="980" y="371" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">that mismatch when it matters.</text>
<rect x="30" y="525" width="1540" height="340" rx="10" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.2"/>
<text x="58" y="563" font-size="20" font-weight="700" fill="#2F6F9E" text-anchor="start">Zones Over the Asset Hierarchy</text>
<text x="58" y="585" font-size="12.5" font-weight="400" fill="#5A6B7B" text-anchor="start">a Zone commonly wraps a Purdue band — but its membership is independent of the Sub-model 2 chain</text>
<rect x="143.0" y="715" width="130" height="50" rx="8" fill="#FFFFFF" stroke="#1F3B57" stroke-width="1.8"/>
<text x="208.0" y="739" font-size="12.5" font-weight="700" fill="#1F3B57" text-anchor="middle">Realm</text>
<text x="208.0" y="757" font-size="10" font-weight="400" fill="#5A6B7B" text-anchor="middle">L4</text>
