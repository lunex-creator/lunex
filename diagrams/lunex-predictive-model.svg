<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1560" width="1600" height="1560" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#E6EBF0" stroke-width="1"/>
  </pattern>
  <pattern id="grid5" width="100" height="100" patternUnits="userSpaceOnUse">
    <rect width="100" height="100" fill="url(#grid)"/>
    <path d="M100 0H0V100" fill="none" stroke="#D6DEE7" stroke-width="1"/>
  </pattern>
  <marker id="tri-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#1F3B57"/>
  </marker>
  <marker id="tri-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#2F6F9E"/>
  </marker>
  <marker id="tri-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#2E7D4F"/>
  </marker>
  <marker id="tri-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#8FA0B3"/>
  </marker>
  <marker id="tri-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#B3402F"/>
  </marker>
</defs>

<rect width="1600" height="1560" fill="#FBFAF8"/>
<rect width="1600" height="1560" fill="url(#grid5)"/>

<text x="60" y="56" font-size="14" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="2.5">LUNEX — SUB-MODEL 15</text>
<text x="60" y="86" font-size="26" font-weight="600" fill="#16202B" text-anchor="start">Predictive Maintenance &amp; Improvement</text>
<text x="60" y="110" font-size="13" font-weight="400" fill="#5A6B7B" text-anchor="start">a third guidance source, built on the Historian (Sub-model 14) — trend-based, not real-time or procedural</text>
<rect x="30" y="145" width="1540" height="300" rx="10" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.2"/>
<text x="58" y="183" font-size="20" font-weight="700" fill="#2F6F9E" text-anchor="start">GuidanceRecommendation.source — a Third Value</text>
<text x="58" y="205" font-size="12.5" font-weight="400" fill="#5A6B7B" text-anchor="start">same field as Sub-model 12, no new schema — procedural | simulated | now also predictive</text>
<rect x="60" y="245" width="473.3333333333333" height="150" rx="10" fill="#FFFFFF" stroke="#5A6B7B" stroke-width="2.4"/>
<text x="78" y="279" font-size="15" font-weight="700" fill="#5A6B7B" text-anchor="start" font-family="Consolas, Menlo, monospace">procedural</text>
<text x="78" y="303" font-size="11.5" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">ARP (Sub-model 11)</text>
<text x="78" y="331" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">static, engineer-written</text>
<rect x="553.3333333333333" y="245" width="473.3333333333333" height="150" rx="10" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.4"/>
<text x="571.3333333333333" y="279" font-size="15" font-weight="700" fill="#2F6F9E" text-anchor="start" font-family="Consolas, Menlo, monospace">simulated</text>
<text x="571.3333333333333" y="303" font-size="11.5" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">Digital Twin (Sub-model 7)</text>
<text x="571.3333333333333" y="331" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">live, current state</text>
<rect x="1046.6666666666665" y="245" width="473.3333333333333" height="150" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2.4"/>
<text x="1064.6666666666665" y="279" font-size="15" font-weight="700" fill="#2E7D4F" text-anchor="start" font-family="Consolas, Menlo, monospace">predictive</text>
<text x="1064.6666666666665" y="303" font-size="11.5" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">Historian (Sub-model 14)</text>
<text x="1064.6666666666665" y="331" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">trend-based, forward-looking</text>
<text x="58" y="420" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">one Operator Guidance Panel (Sub-model 12) still shows all three — the source label tells the operator which kind of claim it is</text>
<rect x="30" y="495" width="1540" height="430" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2.2"/>
<text x="58" y="533" font-size="20" font-weight="700" fill="#2E7D4F" text-anchor="start">PredictedEvent — Joins the Alarm System, Doesn't Sit Beside It</text>
<text x="58" y="555" font-size="12.5" font-weight="400" fill="#5A6B7B" text-anchor="start">one situational-awareness picture (Sub-model 13) — not a second screen the operator has to remember to check</text>
<rect x="60" y="595" width="480" height="260" rx="8" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="78" y="623" font-size="13.5" font-weight="700" fill="#2E7D4F" text-anchor="start">PredictedEvent</text>
<text x="78" y="641" font-size="10" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">extends LunexObject (Sub-model 1)</text>
<text x="78" y="665" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ id : string</text>
<text x="78" y="689" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ subject : DeviceRef</text>
<text x="78" y="713" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ predictedCondition : string</text>
<text x="78" y="737" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ predictedWindow : {from, to}</text>
<text x="78" y="761" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ confidence : 0–1</text>
<text x="78" y="785" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ basis : string  (Historian pattern)</text>
<text x="78" y="809" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ state : Open | Confirmed |</text>
<text x="78" y="833" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">  Dismissed | Expired</text>
<rect x="620" y="595" width="460" height="210" rx="8" fill="#FFFFFF" stroke="#B3402F" stroke-width="2.4"/>
<text x="638" y="623" font-size="13.5" font-weight="700" fill="#B3402F" text-anchor="start" font-family="Consolas, Menlo, monospace">Alarm</text>
<text x="638" y="649" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ origin : real-time | predictive</text>
<text x="638" y="673" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ condition : ref → PredictedEvent</text>
<text x="638" y="697" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ actionable : true  (maintenance can act)</text>
<text x="638" y="721" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ priority : from severity × actionable</text>
<text x="638" y="745" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">  (Sub-model 10, unchanged)</text>
<line x1="540" y1="725.0" x2="620" y2="700.0" stroke="#2E7D4F" stroke-width="2" marker-end="url(#tri-green)"/>
<text x="580.0" y="711.0" font-size="12" font-weight="700" fill="#2E7D4F" text-anchor="middle" font-style="italic">raises</text>
<rect x="1105" y="625" width="180" height="40" rx="20" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<text x="1195" y="650" font-size="12.5" font-weight="700" fill="#2E7D4F" text-anchor="middle">PREDICTIVE</text>
<text x="1195" y="683" font-size="11" font-weight="400" fill="#5A6B7B" text-anchor="middle" font-style="italic">visible tag, so the operator</text>
<text x="1195" y="701" font-size="11" font-weight="400" fill="#5A6B7B" text-anchor="middle" font-style="italic">never confuses “will” with “is”</text>
<text x="58" y="900" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">example: bearing wear predicted in 3–6 weeks → Priority 2 alarm, tagged predictive, same screen as real-time alarms</text>
<rect x="30" y="975" width="1540" height="430" rx="10" fill="#FFFFFF" stroke="#B3402F" stroke-width="2.2"/>
<text x="58" y="1013" font-size="20" font-weight="700" fill="#B3402F" text-anchor="start">ImprovementRecommendation — Always Requires Approval</text>
<text x="58" y="1035" font-size="12.5" font-weight="400" fill="#5A6B7B" text-anchor="start">not a policy choice like Sub-model 12/14 — a fixed rule, with no false-case, by design</text>
<rect x="60" y="1075" width="560" height="270" rx="8" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="78" y="1103" font-size="13.5" font-weight="700" fill="#B3402F" text-anchor="start">ImprovementRecommendation</text>
<text x="78" y="1121" font-size="10" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">extends LunexObject (Sub-model 1)</text>
<text x="78" y="1145" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ id : string</text>
<text x="78" y="1169" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ subject : AssemblyRef | LunexObjectRef</text>
<text x="78" y="1193" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ pattern : string  (what the Historian shows)</text>
<text x="78" y="1217" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ suggestedChange : string</text>
<text x="78" y="1241" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ evidenceBasis : string</text>
<text x="78" y="1265" font-size="12" font-weight="700" fill="#B3402F" text-anchor="start" font-family="Consolas, Menlo, monospace">+ requiresApproval : true  — always</text>
<text x="78" y="1289" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ state : Proposed | UnderReview |</text>
<text x="78" y="1313" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">  Approved | Rejected | Applied</text>
<rect x="700.0" y="1105" width="180.0" height="70" rx="10" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2.2"/>
<text x="790.0" y="1133" font-size="11.5" font-weight="700" fill="#1F3B57" text-anchor="middle">Historian pattern</text>
<text x="790.0" y="1153" font-size="9.5" font-weight="400" fill="#5A6B7B" text-anchor="middle" font-style="italic">e.g. loop oscillating 3 months</text>
<line x1="880.0" y1="1140" x2="906.0" y2="1140" stroke="#1F3B57" stroke-width="1.8" marker-end="url(#tri-navy)"/>
<rect x="906.0" y="1105" width="180.0" height="70" rx="10" fill="#FFFFFF" stroke="#B3402F" stroke-width="2.2"/>
<text x="996.0" y="1133" font-size="11.5" font-weight="700" fill="#B3402F" text-anchor="middle">ImprovementRecommendation</text>
<text x="996.0" y="1153" font-size="9.5" font-weight="400" fill="#5A6B7B" text-anchor="middle" font-style="italic">suggested change + evidence</text>
<line x1="1086.0" y1="1140" x2="1112.0" y2="1140" stroke="#1F3B57" stroke-width="1.8" marker-end="url(#tri-navy)"/>
<rect x="1112.0" y="1105" width="180.0" height="70" rx="10" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.2"/>
<text x="1202.0" y="1133" font-size="11.5" font-weight="700" fill="#2F6F9E" text-anchor="middle">Engineer review</text>
<text x="1202.0" y="1153" font-size="9.5" font-weight="400" fill="#5A6B7B" text-anchor="middle" font-style="italic">always, no exception</text>
<line x1="1292.0" y1="1140" x2="1318.0" y2="1140" stroke="#1F3B57" stroke-width="1.8" marker-end="url(#tri-navy)"/>
<rect x="1318.0" y="1105" width="180.0" height="70" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2.2"/>
<text x="1408.0" y="1133" font-size="11.5" font-weight="700" fill="#2E7D4F" text-anchor="middle">Applied — or not</text>
<text x="1408.0" y="1153" font-size="9.5" font-weight="400" fill="#5A6B7B" text-anchor="middle" font-style="italic">engineer's call, not the AI's</text>
<text x="700" y="1215" font-size="12" font-weight="600" fill="#B3402F" text-anchor="start" font-style="italic">no shortcut from step 2 to step 4 — not even at confidence = 1.0</text>
<text x="700" y="1235" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start">contrast with Sub-model 12: a Scenario can be shown to an operator directly; an</text>
<text x="700" y="1253" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start">ImprovementRecommendation changes how the plant runs — a materially bigger decision</text>
<text x="58" y="1375" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">the Historian finds the pattern and the AI drafts the suggestion — neither one ever touches the configuration</text>
<line x1="60" y1="1445" x2="1540" y2="1445" stroke="#D6DEE7" stroke-width="1"/>
<text x="60" y="1468" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="1.6">LEGEND</text>
<line x1="60" y1="1500" x2="106" y2="1500" stroke="#2E7D4F" stroke-width="2" marker-end="url(#tri-green)"/>
<text x="118" y="1505" font-size="13" font-weight="400" fill="#16202B" text-anchor="start">raises (PredictedEvent → Alarm)</text>
<line x1="430" y1="1500" x2="476" y2="1500" stroke="#1F3B57" stroke-width="1.8" marker-end="url(#tri-navy)"/>
<text x="488" y="1505" font-size="13" font-weight="400" fill="#16202B" text-anchor="start">mandatory workflow step</text>
</svg>