<text x="760" y="838" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">from Sub-model 4 — an Inhibited Vessel</text>
<text x="760" y="856" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">and an Emergency Stopping Pump at the</text>
<text x="760" y="874" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">same time. Nothing is lost: the badge</text>
<text x="760" y="892" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">shows worstTier for a glance, but every</text>
<text x="760" y="910" font-size="12" font-weight="400" fill="#33404D" text-anchor="start">contributor stays visible on demand.</text>
<text x="58" y="1120" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">the subject's own state (LunexObject.state, Sub-model 1) is never touched by this — shown side by side, as agreed</text>
