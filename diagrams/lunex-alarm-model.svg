<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2020" width="1600" height="2020" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#E6EBF0" stroke-width="1"/>
  </pattern>
  <pattern id="grid5" width="100" height="100" patternUnits="userSpaceOnUse">
    <rect width="100" height="100" fill="url(#grid)"/>
    <path d="M100 0H0V100" fill="none" stroke="#D6DEE7" stroke-width="1"/>
  </pattern>
  <marker id="tri-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#1F3B57"/>
  </marker>
  <marker id="tri-hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M0 0 L12 6 L0 12 Z" fill="#FFFFFF" stroke="#1F3B57" stroke-width="1.4"/>
  </marker>
  <marker id="tri-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 Z" fill="#8FA0B3"/>
  </marker>
</defs>

<rect width="1600" height="2020" fill="#FBFAF8"/>
<rect width="1600" height="2020" fill="url(#grid5)"/>

<text x="60" y="56" font-size="14" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="2.5">LUNEX — SUB-MODEL 10</text>
<text x="60" y="86" font-size="26" font-weight="600" fill="#16202B" text-anchor="start">Alarm Management</text>
<text x="60" y="110" font-size="13" font-weight="400" fill="#5A6B7B" text-anchor="start">ISA-18.2-based — priority is severity × actionability, not severity alone</text>
<rect x="30" y="145" width="1540" height="410" rx="10" fill="#FFFFFF" stroke="#B3402F" stroke-width="2.2"/>
<text x="58" y="183" font-size="20" font-weight="700" fill="#B3402F" text-anchor="start">Alarm — a First-Class LunexObject</text>
<text x="58" y="205" font-size="12.5" font-weight="400" fill="#5A6B7B" text-anchor="start">same pattern as Interlock, Zone and Conduit — a peer of Device and Component</text>
<rect x="90" y="245" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="200.0" y="267" font-size="13.5" font-weight="700" fill="#1F3B57" text-anchor="middle">LunexObject</text>
<text x="200.0" y="285" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="middle" font-style="italic">«abstract»</text>
<rect x="110" y="340" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#B3402F" stroke-width="2.4"/>
<text x="200.0" y="366" font-size="15" font-weight="700" fill="#B3402F" text-anchor="middle">Alarm</text>
<text x="200.0" y="386" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="middle" font-style="italic">extends LunexObject</text>
<path d="M 200.0 340 L 200.0 295" fill="none" stroke="#1F3B57" stroke-width="2" marker-end="url(#tri-hollow)"/>
<rect x="380" y="245" width="560" height="250" rx="8" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2"/>
<text x="398" y="275" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ id : string</text>
<text x="398" y="299" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ source : DeviceRef</text>
<text x="398" y="323" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ condition : string</text>
<text x="398" y="347" font-size="12" font-weight="400" fill="#2F6F9E" text-anchor="start" font-family="Consolas, Menlo, monospace">+ severity : Tier (0–3, Sub-model 9)</text>
<text x="398" y="371" font-size="12" font-weight="400" fill="#2E7D4F" text-anchor="start" font-family="Consolas, Menlo, monospace">+ actionable : bool  ← derived, Panel 3</text>
<text x="398" y="395" font-size="12" font-weight="400" fill="#B3402F" text-anchor="start" font-family="Consolas, Menlo, monospace">+ priority : 1–4  ← derived, Panel 2</text>
<text x="398" y="419" font-size="12" font-weight="400" fill="#1F3B57" text-anchor="start" font-family="Consolas, Menlo, monospace">+ state : AlarmState (new, Panel 4)</text>
<text x="398" y="443" font-size="12" font-weight="400" fill="#B3402F" text-anchor="start" font-family="Consolas, Menlo, monospace">+ resetMode : auto | manual</text>
<text x="398" y="467" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">+ shelvedUntil : timestamp</text>
<text x="58" y="517" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">priority and actionable are computed, not set by hand — same discipline as Sub-model 7/9's derived views</text>
<rect x="30" y="605" width="1540" height="380" rx="10" fill="#FFFFFF" stroke="#B3402F" stroke-width="2.2"/>
<text x="58" y="643" font-size="20" font-weight="700" fill="#B3402F" text-anchor="start">Priority — Severity × Actionability, Not Severity Alone</text>
<text x="58" y="665" font-size="12.5" font-weight="400" fill="#5A6B7B" text-anchor="start">an alarm the operator can still act on outranks one the system already handled</text>
<rect x="340" y="725" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#B3402F" stroke-width="2.4"/>
<text x="360" y="759" font-size="15" font-weight="700" fill="#B3402F" text-anchor="start">Priority 1 — Critical</text>
<text x="360" y="783" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start">operator can still prevent escalation</text>
<rect x="760" y="725" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2.4"/>
<text x="780" y="759" font-size="15" font-weight="700" fill="#2F6F9E" text-anchor="start">Priority 2 — High</text>
<text x="780" y="783" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start">operator can still act, lower severity</text>
<rect x="340" y="825" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#5A6B7B" stroke-width="2.4"/>
<text x="360" y="859" font-size="15" font-weight="700" fill="#5A6B7B" text-anchor="start">Priority 3 — Informational</text>
<text x="360" y="883" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start">already handled (e.g. by an Interlock) — Sub-model 5</text>
<rect x="760" y="825" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#8FA0B3" stroke-width="2.4"/>
<text x="780" y="859" font-size="15" font-weight="700" fill="#8FA0B3" text-anchor="start">Priority 4 — Log Only</text>
<text x="780" y="883" font-size="11.5" font-weight="400" fill="#33404D" text-anchor="start">already handled, low severity</text>
<text x="320" y="780.0" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="end">high</text>
<text x="320" y="880.0" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="end">low</text>
<text x="270" y="825" font-size="12.5" font-weight="700" fill="#16202B" text-anchor="middle">severity</text>
<text x="550.0" y="700" font-size="12.5" font-weight="700" fill="#2E7D4F" text-anchor="middle">actionable = true</text>
<text x="970.0" y="700" font-size="12.5" font-weight="700" fill="#5A6B7B" text-anchor="middle">actionable = false</text>
<text x="58" y="950" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">“actionable” answers one question: can the operator still change the outcome? (Panel 3)</text>
<rect x="30" y="1035" width="1540" height="260" rx="10" fill="#FFFFFF" stroke="#B3402F" stroke-width="2.2"/>
<text x="58" y="1073" font-size="20" font-weight="700" fill="#B3402F" text-anchor="start">actionable — Derived Automatically from Interlock State</text>
<text x="58" y="1095" font-size="12.5" font-weight="400" fill="#5A6B7B" text-anchor="start">not a manual flag — it follows the linked Interlock's state (Sub-model 5), so it can't be left wrong</text>
<rect x="70" y="1150" width="620" height="90" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2.2"/>
<text x="96" y="1180" font-size="13" font-weight="700" fill="#2E7D4F" text-anchor="start">Interlock IL-014: state = Standby (not yet tripped)</text>
<text x="96" y="1208" font-size="12.5" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">→ Alarm.actionable = true → Priority 1, if severity is high</text>
<rect x="730" y="1150" width="620" height="90" rx="10" fill="#FFFFFF" stroke="#5A6B7B" stroke-width="2.2"/>
<text x="756" y="1180" font-size="13" font-weight="700" fill="#5A6B7B" text-anchor="start">Interlock IL-014: state = Inhibited (already tripped)</text>
<text x="756" y="1208" font-size="12.5" font-weight="400" fill="#33404D" text-anchor="start" font-family="Consolas, Menlo, monospace">→ Alarm.actionable = false → Priority 3, same severity</text>
<path d="M 690 1195 L 730 1195" fill="none" stroke="#8FA0B3" stroke-width="1.8" marker-end="url(#tri-gray)" stroke-dasharray="4,3"/>
<text x="58" y="1265" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">the operator sees the same underlying condition drop from Priority 1 to Priority 3 the instant the Interlock trips</text>
<rect x="30" y="1345" width="1540" height="520" rx="10" fill="#FFFFFF" stroke="#1F3B57" stroke-width="2.2"/>
<text x="58" y="1383" font-size="20" font-weight="700" fill="#1F3B57" text-anchor="start">Alarm State Machine — New, Not Reused From Sub-model 4</text>
<text x="58" y="1405" font-size="12.5" font-weight="400" fill="#5A6B7B" text-anchor="start">operator-response states, not object-behavior states — deliberately a separate value space</text>
<ellipse cx="150" cy="1585" rx="70.0" ry="26.0" fill="#1F3B57"/>
<text x="150" y="1590" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Normal</text>
<rect x="410.0" y="1563.0" width="160" height="44" rx="22.0" fill="#FFFFFF" stroke="#B3402F" stroke-width="2"/>
<text x="490" y="1590" font-size="12" font-weight="600" fill="#B3402F" text-anchor="middle">Unacknowledged</text>
<rect x="750.0" y="1563.0" width="160" height="44" rx="22.0" fill="#FFFFFF" stroke="#2F6F9E" stroke-width="2"/>
<text x="830" y="1590" font-size="12" font-weight="600" fill="#2F6F9E" text-anchor="middle">Acknowledged</text>
<rect x="70.0" y="1743.0" width="160" height="44" rx="22.0" fill="#FFFFFF" stroke="#8FA0B3" stroke-width="2"/>
<text x="150" y="1770" font-size="12" font-weight="600" fill="#8FA0B3" text-anchor="middle">Out-of-Service</text>
<rect x="410.0" y="1743.0" width="160" height="44" rx="22.0" fill="#FFFFFF" stroke="#5A6B7B" stroke-width="2"/>
<text x="490" y="1770" font-size="12" font-weight="600" fill="#5A6B7B" text-anchor="middle">Suppressed</text>
<rect x="750.0" y="1743.0" width="160" height="44" rx="22.0" fill="#FFFFFF" stroke="#5A6B7B" stroke-width="2"/>
<text x="830" y="1770" font-size="12" font-weight="600" fill="#5A6B7B" text-anchor="middle">Shelved</text>
<line x1="220" y1="1585" x2="410" y2="1585" stroke="#B3402F" stroke-width="2" marker-end="url(#tri-navy)"/>
<text x="320.0" y="1569" font-size="11.5" font-weight="400" fill="#B3402F" text-anchor="middle" font-style="italic" stroke="#FBFAF8" stroke-width="5" paint-order="stroke" stroke-linejoin="round">condition trips</text>
<line x1="570" y1="1585" x2="750" y2="1585" stroke="#5A6B7B" stroke-width="2" marker-end="url(#tri-gray)" stroke-dasharray="3,3"/>
<text x="660.0" y="1569" font-size="11.5" font-weight="400" fill="#5A6B7B" text-anchor="middle" font-style="italic" stroke="#FBFAF8" stroke-width="5" paint-order="stroke" stroke-linejoin="round">acknowledge (operator)</text>
<path d="M 830 1559 C 740 1515, 580.0 1485, 560.0 1485" fill="none" stroke="#2E7D4F" stroke-width="2" marker-end="url(#tri-navy)"/>
<text x="695.0" y="1523" font-size="11" font-weight="400" fill="#2E7D4F" text-anchor="middle" font-style="italic" stroke="#FBFAF8" stroke-width="5" paint-order="stroke" stroke-linejoin="round">condition clears</text>
<rect x="415.0" y="1465.0" width="150" height="40" rx="20.0" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<text x="490.0" y="1490" font-size="12" font-weight="600" fill="#2E7D4F" text-anchor="middle">Cleared (RTN)</text>
<path d="M 420.0 1491 C 300.0 1540, 220 1515, 168 1561" fill="none" stroke="#2E7D4F" stroke-width="2" marker-end="url(#tri-navy)"/>
<text x="295.0" y="1513" font-size="10.5" font-weight="700" fill="#2E7D4F" text-anchor="middle" font-style="italic" stroke="#FBFAF8" stroke-width="5" paint-order="stroke" stroke-linejoin="round">resetMode: auto</text>
<text x="295.0" y="1529" font-size="10.5" font-weight="400" fill="#2E7D4F" text-anchor="middle" font-style="italic" stroke="#FBFAF8" stroke-width="5" paint-order="stroke" stroke-linejoin="round">→ immediate</text>
<path d="M 400.0 1481 C 250.0 1435, 110 1425, 132 1561" fill="none" stroke="#5A6B7B" stroke-width="2" marker-end="url(#tri-gray)" stroke-dasharray="3,3"/>
<text x="255.0" y="1427" font-size="10.5" font-weight="700" fill="#5A6B7B" text-anchor="middle" font-style="italic" stroke="#FBFAF8" stroke-width="5" paint-order="stroke" stroke-linejoin="round">resetMode: manual</text>
<text x="255.0" y="1443" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="middle" font-style="italic" stroke="#FBFAF8" stroke-width="5" paint-order="stroke" stroke-linejoin="round">→ operator resets</text>
<line x1="150" y1="1611" x2="150" y2="1743" stroke="#8FA0B3" stroke-width="1.6" marker-end="url(#tri-gray)" stroke-dasharray="3,3"/>
<text x="136" y="1675.0" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="end" font-style="italic">taken out of service</text>
<line x1="166" y1="1743" x2="166" y2="1611" stroke="#8FA0B3" stroke-width="1.6" marker-end="url(#tri-gray)" stroke-dasharray="3,3"/>
<text x="180" y="1675.0" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">returned</text>
<line x1="474" y1="1607" x2="474" y2="1743" stroke="#5A6B7B" stroke-width="1.6" marker-end="url(#tri-gray)" stroke-dasharray="3,3"/>
<text x="460" y="1675.0" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="end" font-style="italic">suppression rule fires</text>
<line x1="506" y1="1743" x2="506" y2="1607" stroke="#5A6B7B" stroke-width="1.6" marker-end="url(#tri-gray)" stroke-dasharray="3,3"/>
<text x="520" y="1675.0" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">rule ends</text>
<line x1="814" y1="1607" x2="814" y2="1743" stroke="#5A6B7B" stroke-width="1.6" marker-end="url(#tri-gray)" stroke-dasharray="3,3"/>
<text x="800" y="1675.0" font-size="11" font-weight="400" fill="#5A6B7B" text-anchor="end" font-style="italic">shelve</text>
<line x1="846" y1="1743" x2="846" y2="1607" stroke="#5A6B7B" stroke-width="1.6" marker-end="url(#tri-gray)" stroke-dasharray="2,5"/>
<text x="860" y="1675.0" font-size="10.5" font-weight="400" fill="#5A6B7B" text-anchor="start" font-style="italic">shelvedUntil expires</text>
<text x="58" y="1830" font-size="12" font-weight="400" fill="#33404D" text-anchor="start" font-style="italic">Shelved always expires back into Unacknowledged — an operator can delay an alarm, never silence it permanently</text>
<line x1="60" y1="1905" x2="1540" y2="1905" stroke="#D6DEE7" stroke-width="1"/>
<text x="60" y="1928" font-size="12" font-weight="400" fill="#5A6B7B" text-anchor="start" letter-spacing="1.6">LEGEND</text>
<line x1="60" y1="1960" x2="106" y2="1960" stroke="#B3402F" stroke-width="2" marker-end="url(#tri-navy)"/>
<text x="118" y="1965" font-size="13" font-weight="400" fill="#16202B" text-anchor="start">alarm raised</text>
<line x1="280" y1="1960" x2="326" y2="1960" stroke="#2E7D4F" stroke-width="2" marker-end="url(#tri-navy)"/>
<text x="338" y="1965" font-size="13" font-weight="400" fill="#16202B" text-anchor="start">condition clears</text>
<line x1="520" y1="1960" x2="566" y2="1960" stroke="#5A6B7B" stroke-width="1.8" marker-end="url(#tri-gray)" stroke-dasharray="3,3"/>
<text x="578" y="1965" font-size="13" font-weight="400" fill="#16202B" text-anchor="start">operator or timed action</text>
</svg>