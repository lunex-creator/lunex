<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<!-- ============ BACKGROUND ============ -->
<rect width="1200" height="900" fill="#FBFAF8"/>

<!-- ============ TITLE ============ -->
<text x="60" y="56" font-size="14" letter-spacing="2.5" fill="#5A6B7B">LUNEX — OT REFERENCE MODEL</text>
<text x="60" y="86" font-size="26" font-weight="600" fill="#16202B">Brand concept: mark, palette, type</text>

<!-- ============ LOGO — LIGHT VARIANT ============ -->
<g transform="translate(120,220)">
  <rect x="-90" y="-90" width="260" height="260" rx="14" fill="#FFFFFF" stroke="#E6EBF0" stroke-width="1.5"/>
  <text x="40" y="-105" font-size="12" letter-spacing="2" fill="#5A6B7B" text-anchor="middle">LIGHT</text>

  <!-- stacked class squares, derived from the notebook "classes (objects)" sketch -->
  <g transform="rotate(-8)">
    <rect x="-20" y="-20" width="90" height="90" rx="12" fill="none" stroke="#2F6F9E" stroke-width="3"/>
  </g>
  <g transform="rotate(-3)">
    <rect x="-10" y="-10" width="90" height="90" rx="12" fill="none" stroke="#2E7D4F" stroke-width="3"/>
  </g>
  <rect x="0" y="0" width="90" height="90" rx="12" fill="#1F3B57"/>

  <!-- network node breaking out of the stack -->
  <circle cx="90" cy="0" r="9" fill="#2E7D4F"/>
  <line x1="45" y1="-25" x2="90" y2="0" stroke="#2E7D4F" stroke-width="3" stroke-linecap="round"/>

  <text x="40" y="140" font-size="30" font-weight="700" letter-spacing="1" fill="#16202B" text-anchor="middle">LUNEX</text>
  <text x="40" y="163" font-size="11" letter-spacing="2.5" fill="#5A6B7B" text-anchor="middle">OT REFERENCE MODEL</text>
</g>

<!-- ============ LOGO — DARK VARIANT ============ -->
<g transform="translate(430,220)">
  <rect x="-90" y="-90" width="260" height="260" rx="14" fill="#0B1120"/>
  <text x="40" y="-105" font-size="12" letter-spacing="2" fill="#5A6B7B" text-anchor="middle">DARK</text>

  <g transform="rotate(-8)">
    <rect x="-20" y="-20" width="90" height="90" rx="12" fill="none" stroke="#2F6F9E" stroke-width="3"/>
  </g>
  <g transform="rotate(-3)">
    <rect x="-10" y="-10" width="90" height="90" rx="12" fill="none" stroke="#2E7D4F" stroke-width="3"/>
  </g>
  <rect x="0" y="0" width="90" height="90" rx="12" fill="#FFFFFF"/>

  <circle cx="90" cy="0" r="9" fill="#3FCB7C"/>
  <line x1="45" y1="-25" x2="90" y2="0" stroke="#3FCB7C" stroke-width="3" stroke-linecap="round"/>

  <text x="40" y="140" font-size="30" font-weight="700" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">LUNEX</text>
  <text x="40" y="163" font-size="11" letter-spacing="2.5" fill="#8FA0B3" text-anchor="middle">OT REFERENCE MODEL</text>
</g>

<!-- ============ RATIONALE TEXT ============ -->
<g transform="translate(760,150)">
  <text x="0" y="0" font-size="13" font-weight="600" letter-spacing="1" fill="#16202B">MARK RATIONALE</text>
  <text x="0" y="28" font-size="13" fill="#33404D">Three stacked rounded squares, derived</text>
  <text x="0" y="48" font-size="13" fill="#33404D">directly from your own "classes (objects)"</text>
  <text x="0" y="68" font-size="13" fill="#33404D">sketch — inheritance made visible.</text>
  <text x="0" y="98" font-size="13" fill="#33404D">A single node breaks out of the stack:</text>
  <text x="0" y="118" font-size="13" fill="#33404D">the object is never static, it connects,</text>
  <text x="0" y="138" font-size="13" fill="#33404D">reports state, feeds a network — the</text>
  <text x="0" y="158" font-size="13" fill="#33404D">AI/analytics layer PackML and S88 lack.</text>
</g>

<!-- ============ COLOR PALETTE ============ -->
<text x="60" y="410" font-size="13" font-weight="600" letter-spacing="1" fill="#16202B">COLOR TOKENS</text>
<text x="60" y="430" font-size="12" fill="#5A6B7B">Grounded in your own state-diagram palette — engineering-drawing register, not startup-neon.</text>

<g transform="translate(60,455)">
  <!-- swatch template repeated -->
  <g>
    <rect width="140" height="90" rx="8" fill="#0B1120"/>
    <text x="10" y="70" font-size="11" fill="#FFFFFF">background.dark</text>
    <text x="10" y="84" font-size="10" fill="#8FA0B3">#0B1120</text>
  </g>
  <g transform="translate(155,0)">
    <rect width="140" height="90" rx="8" fill="#FBFAF8" stroke="#E6EBF0"/>
    <text x="10" y="70" font-size="11" fill="#16202B">background.light</text>
    <text x="10" y="84" font-size="10" fill="#5A6B7B">#FBFAF8</text>
  </g>
  <g transform="translate(310,0)">
    <rect width="140" height="90" rx="8" fill="#1F3B57"/>
    <text x="10" y="70" font-size="11" fill="#FFFFFF">structure.navy</text>
    <text x="10" y="84" font-size="10" fill="#B9C6D3">#1F3B57</text>
  </g>
  <g transform="translate(465,0)">
    <rect width="140" height="90" rx="8" fill="#2E7D4F"/>
    <text x="10" y="70" font-size="11" fill="#FFFFFF">state.active</text>
    <text x="10" y="84" font-size="10" fill="#CFEFDC">#2E7D4F</text>
  </g>
  <g transform="translate(620,0)">
    <rect width="140" height="90" rx="8" fill="#2F6F9E"/>
    <text x="10" y="70" font-size="11" fill="#FFFFFF">state.transition</text>
    <text x="10" y="84" font-size="10" fill="#CFE1EF">#2F6F9E</text>
  </g>
  <g transform="translate(775,0)">
    <rect width="140" height="90" rx="8" fill="#B3402F"/>
    <text x="10" y="70" font-size="11" fill="#FFFFFF">state.critical</text>
    <text x="10" y="84" font-size="10" fill="#F3D3CC">#B3402F</text>
  </g>
  <g transform="translate(930,0)">
    <rect width="140" height="90" rx="8" fill="#5A6B7B"/>
    <text x="10" y="70" font-size="11" fill="#FFFFFF">ink.muted</text>
    <text x="10" y="84" font-size="10" fill="#DEE5EC">#5A6B7B</text>
  </g>
</g>

<!-- ============ USAGE NOTES ============ -->
<g transform="translate(60,600)">
  <text x="0" y="0" font-size="13" font-weight="600" letter-spacing="1" fill="#16202B">USAGE PRINCIPLE</text>
  <text x="0" y="26" font-size="13" fill="#33404D">structure.navy is the brand's resting color — used for stable states, headers, chrome.</text>
  <text x="0" y="48" font-size="13" fill="#33404D">state.active (green) and state.transition (blue) are reserved for behavior: a device or</text>
  <text x="0" y="70" font-size="13" fill="#33404D">model instance actually running or changing state — never used decoratively.</text>
  <text x="0" y="92" font-size="13" fill="#33404D">state.critical (red) is reserved exclusively for safety/emergency states, matching IEC</text>
  <text x="0" y="114" font-size="13" fill="#33404D">60204-1 color convention — this is what lets LUNEX diagrams double as safety documentation.</text>
</g>

<!-- ============ TYPE SAMPLE ============ -->
<g transform="translate(60,760)">
  <text x="0" y="0" font-size="13" font-weight="600" letter-spacing="1" fill="#16202B">TYPE</text>
  <text x="0" y="34" font-size="28" font-weight="700" fill="#16202B">Assembly.ControlUnit.Transducer</text>
  <text x="0" y="60" font-size="13" fill="#33404D" font-family="Consolas, Menlo, monospace">tag: PLC-101 · state: Running · sil: 2 · zone: Level 2</text>
  <text x="0" y="90" font-size="12" fill="#5A6B7B">Display/heading: geometric grotesk (Inter). Data/tags/parameters: monospace —</text>
  <text x="0" y="108" font-size="12" fill="#5A6B7B">echoes P&amp;ID tag conventions, keeps machine-readable identifiers visually distinct from prose.</text>
</g>

</svg>
